name: Python checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff and ty
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ty check --error-on-warning

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s . -p 'test_*.py' -v

  integration:
    name: Real WeeChat and localhost IRC
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
          python-version: "3.12"
          enable-cache: true
      - name: Install real WeeChat with Python and IRC plugins
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y weechat-headless weechat-plugins weechat-python
      - name: Check out pinned official miniircd
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrosdahl/miniircd
          ref: 42a8f800dc77d9106fe9a753c81299e8cabf5de3
          path: .ci/miniircd
          persist-credentials: false
      - run: uv sync --locked
      - name: Verify native buffer data and lifecycle
        run: timeout 60s uv run --locked python native_buffer_live_test.py --weechat-root /
      - name: Verify actual IRC delivery, subscriptions, and durable wakeup
        run: |
          set -o pipefail
          timeout 120s uv run --locked python live_test.py \
            --weechat-root / --miniircd .ci/miniircd/miniircd | tee integration.log

  docker:
    name: Docker image and bearer/private HTTP IRC roundtrips
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
          python-version: "3.12"
          enable-cache: true
      - name: Check out pinned official miniircd
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrosdahl/miniircd
          ref: 42a8f800dc77d9106fe9a753c81299e8cabf5de3
          path: .ci/miniircd
          persist-credentials: false
      - run: uv sync --locked
      - name: Build actual image and exercise HTTP MCP against localhost IRC
        run: timeout 600s uv run --locked python docker_test.py --miniircd .ci/miniircd/miniircd
      - name: Exercise same image with simulated Railway-private mode and no bearer
        run: timeout 180s uv run --locked python docker_test.py --miniircd .ci/miniircd/miniircd --skip-build --railway-private

  auth_topology:
    name: Patched Pomerium and Dex auth topology
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the pinned refresh-authority source with race tests
        run: timeout 1800s bash deploy/pomerium/refresh-authority/build.sh
      - name: Build both auth images and verify the two-origin TLS topology
        run: timeout 1800s python3 deploy/container_auth_test.py --refresh-flow
